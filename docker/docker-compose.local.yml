services:

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: fastapi-local-api

    ports:
      - "8000:8000"

    env_file:
      - ../env/docker.env

    volumes:
      - ../app:/app/app

    depends_on:
      - db


  db:
    image: postgres:16

    container_name: fastapi-local-db

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: architecture_lab

    volumes:
      - postgres_local_data:/var/lib/postgresql/data


volumes:

  postgres_local_data: