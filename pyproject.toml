[project]
name = "fastapi-architecture-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pkc035", email = "pkc0305@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.128.8",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.39.0",
]

[project.scripts]
fastapi-architecture-lab = "fastapi_architecture_lab:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
